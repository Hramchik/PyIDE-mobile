name: Build PyIDE APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.9

    - name: Build with Gradle
      run: |
        # Если файл settings.gradle.kts есть в корне - собираем в корне
        if [ -f "settings.gradle.kts" ]; then
          echo "Файлы в корне, собираем здесь..."
          gradle assembleDebug
        # Если его нет, но он есть в папке PyIDE - заходим в нее
        elif [ -f "PyIDE/settings.gradle.kts" ]; then
          echo "Файлы в папке PyIDE, заходим туда..."
          cd PyIDE
          gradle assembleDebug
        # Если нет ни там, ни там - выводим ошибку и список файлов
        else
          echo "ОШИБКА: Не могу найти файлы сборки!"
          ls -la
          ls -la PyIDE
          exit 1
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: PyIDE-debug-apk
        # Ищем APK по обоим возможным путям
        path: |
          app/build/outputs/apk/debug/*.apk
          PyIDE/app/build/outputs/apk/debug/*.apk
